# MAS - Multi-Agent System for Graphics Card Assembly
# Docker Compose Configuration

version: '3.8'

services:
  # ============================================================
  # Neo4j - 圖資料庫 (用於 Graphiti 長期記憶)
  # ============================================================
  neo4j:
    image: neo4j:5.15.0
    container_name: mas-neo4j
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt (Driver)
    environment:
      - NEO4J_AUTH=neo4j/password123    # 預設帳密，生產環境請更改
      - NEO4J_PLUGINS=["apoc"]          # 啟用 APOC 插件
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - mas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Redis - 短期記憶快取 (可選)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: mas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ============================================================
# Volumes - 持久化儲存
# ============================================================
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local

# ============================================================
# Networks - 網路配置
# ============================================================
networks:
  mas-network:
    driver: bridge
